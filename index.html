<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy Duck - MoorDuck Clone</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/language-manager.js" defer></script>
</head>
<body>
    <!-- ============================================
         HTML - Game Markup
         ============================================ -->

    <!-- Supabase Client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Canvas for rendering -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI elements -->
    <div id="ui">
        <div id="topBar">
            <div class="stat-box">
                <div class="stat-label" data-i18n="game.score">SCORE</div>
                <div class="stat-value" id="scoreValue">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" data-i18n="game.ammo">AMMO</div>
                <div class="stat-value" id="ammoValue">60</div>
                <div id="reloadIndicator" style="display: none; color: #FFA500; font-size: 12px; margin-top: 5px;">⏳ RELOADING...</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" data-i18n="game.time">TIME</div>
                <div class="stat-value" id="timeValue">90</div>
            </div>
            <div class="stat-box" style="min-width: 120px;">
                <div class="stat-label" data-i18n="game.ducks">DUCKS</div>
                <div class="stat-value" style="font-size: 18px;">
                    <span id="spawnedValue">0</span> / <span id="hitValue">0</span>
                </div>
            </div>
        </div>
        
        <!-- Language Selector -->
        <div id="languageSelector">
            <button id="currentLanguageBtn">
                <span id="currentFlag">En</span>
                <span id="currentName">English</span>
            </button>
            <div class="language-dropdown" id="languageOptions">
                <!-- Language options will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="menu">
        <h1 class="menu-title" data-i18n="menu.title">🐥 CRAZY DUCK 🐥</h1>
        <p class="menu-subtitle" data-i18n="menu.subtitle">Duck Hunting</p>

        <div id="gameOver" style="display: none;">
            <h1 class="menu-title gameOver-title" id="gameOverTitle" data-i18n="gameOver.title">GAME OVER</h1>
            <div id="finalScore" data-i18n="gameOver.finalScore">Score: 0</div>

            <div id="highscoreForm">
                <label style="color: #DEB887;" data-i18n="gameOver.enterName">Enter your name:</label>
                <input type="text" id="playerName" maxlength="10" data-i18n="gameOver.enterName" placeholder="Name">
                <button class="menu-btn" id="saveScoreBtn" data-i18n="gameOver.saveBtn">SAVE</button>
            </div>           
        </div>

        <button class="menu-btn" id="startBtn" data-i18n="menu.startBtn">START GAME</button>

        <!-- Leaderboard (collapsible) -->
        <div id="menuHighscores" style="margin: 20px 0; padding: 15px; background: rgba(139, 69, 19, 0.5); border-radius: 10px; max-width: 500px; width: 90%;">
            <h3 id="menuHighscoresHeader" style="color: #FFD700; margin: 0; text-align: center; cursor: pointer; user-select: none;" title="Click to collapse/expand">
                <span data-i18n="menu.leaderboard">🏆 LEADERBOARD</span> <span id="menuHighscoresToggle" data-i18n="menu.leaderboardToggle">▼</span>
            </h3>
            <div id="menuHighscoresContent" style="margin-top: 10px;">
                <ol id="menuHighscoreListOl" style="color: #DEB887; padding-left: 20px;"></ol>
                <div id="menuNetworkStatus" style="text-align: center; margin-top: 10px; font-size: 14px;">
                    <span id="menuNetworkIndicator" style="font-size: 18px;">🔄</span>
                </div>
            </div>
        </div>

        <!-- Instructions (collapsible) -->
        <div class="instructions" style="max-width: 500px; width: 90%;">
            <h3 id="instructionsHeader" style="color: #FFD700; margin: 0; text-align: center; cursor: pointer; user-select: none;" title="Click to collapse/expand">
                <span data-i18n="menu.instructions">📜 INSTRUCTIONS</span> <span id="instructionsToggle" data-i18n="menu.instructionsToggle">▼</span>
            </h3>
            <div id="instructionsContent">
                <ul id="instructionList">
                    <!-- Instructions will be populated by JavaScript -->
                </ul>
            </div>
        </div>
    </div>


    <!-- Game Scripts -->
    <script src="js/sound-manager.js"></script>
    <script src="js/particle.js"></script>
    <script src="js/chicken.js"></script>
    <script src="js/background.js"></script>
    <script src="js/database-manager.js"></script>
    <script src="js/game-manager.js"></script>

    <!-- Game Start -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.languageManager) {
                window.languageManager.init().catch(err => {
                    console.warn('Language initialization failed:', err);
                });
            }
            const game = new GameManager();
        });
    </script>
</body>
</html>
